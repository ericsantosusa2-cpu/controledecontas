<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Produção</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CONTROLE DE PRODUÇÃO</h1>
        <div id="usuarioAtual">Carregando...</div>
    </header>

    <div class="dashboard">

    <div class="card">
        <div class="card-title">
            📄 Contas
        </div>
        <div class="card-value" id="contas">
            0
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            📁 Protocolos
        </div>
        <div class="card-value" id="protocolos">
            0
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            📊 Total
        </div>
        <div class="card-value" id="total">
            0
        </div>
    </div>

</div>

    <div class="container">

        <input
            type="text"
            id="codigo"
            placeholder="Bipe ou digite o código"
            autocomplete="off">

        <div class="acoes">
            <button onclick="registrar()">
                Registrar
            </button>

            <button onclick="trocarUsuario()">
                Trocar Usuário
            </button>

            <button onclick="exportarCSV()">
                Exportar CSV
            </button>
        </div>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar código, tipo ou usuário..."
            onkeyup="filtrar()">

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Tipo</th>
                    <th>Usuário</th>
                    <th>Data/Hora</th>
                </tr>
            </thead>

            <tbody id="tabela">
            </tbody>
        </table>

    </div>

    <footer>
        BY: ERIC SANTOS
    </footer>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração do Supabase -->
    <script src="supabase.js"></script>

    <!-- Sistema -->
    <script src="app.js"></script>

</body>

</html>
